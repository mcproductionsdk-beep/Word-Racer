<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Word Racer — Test Menu</title><style>
*{box-sizing:border-box}body{margin:0;background:#78bbdf;color:#102846;font:18px "Courier New",monospace}main{max-width:760px;margin:20px auto;padding:20px;background:#f4e6bd;border:6px solid #112b4b;box-shadow:8px 8px #142a44}h1{text-align:center;letter-spacing:4px}section{padding:18px;background:#233f65;color:#fff;border:4px solid #6fb6e5}label{display:block;margin:14px 0 5px;font-weight:bold}select,textarea{width:100%;padding:12px;background:#f4f5ff;border:4px solid #102846;font:18px "Courier New"}textarea{height:160px}button{padding:14px;background:#f6d951;border:4px solid #122c4b;color:#122c4b;font:900 18px "Courier New";cursor:pointer;margin-top:14px}#play{display:none;position:fixed;inset:0;background:#10192e;z-index:5}#game{width:100%;height:100%;border:0}#back{position:absolute;right:12px;top:8px;z-index:2;font-size:13px;margin:0;padding:7px}small{display:block;margin-top:12px;color:#cbdaf1}
</style></head><body><main><h1>WORD RACER</h1><section><h2>TEST MENU · DEVELOPMENT ONLY</h2><label for="prompt">PROMPT LANGUAGE</label><select id="prompt"><option value="en-US">English</option><option value="es-ES">Spanish</option><option value="de-DE">German</option><option value="da-DK">Danish</option><option value="fr-FR">French</option><option value="it-IT">Italian</option></select><label for="target">TARGET LANGUAGE</label><select id="target"><option value="es-ES">Spanish</option><option value="en-US">English</option><option value="de-DE">German</option><option value="da-DK">Danish</option><option value="fr-FR">French</option><option value="it-IT">Italian</option></select><label for="pairs">VOCABULARY (prompt TAB target, one pair per line)</label><textarea id="pairs" spellcheck="false">cat	gato
dog	perro
mouse	ratón
pig	cerdo
fish	pez
bird	pájaro
book	libro
house	casa
water	agua
sun	sol
tree	árbol
car	coche</textarea><button id="swap" type="button">⇄ SWAP LANGUAGES + COLUMNS</button> <button id="start" type="button">START TEST GAME</button><p id="error" role="alert"></p><small>No sets are created, edited or deleted. Vocabulary stays in this browser session. Mobile and desktop use their respective production gameplay engines.</small></section></main><div id="play"><button id="back" type="button">TEST MENU</button><iframe id="game" title="Word Racer"></iframe></div><script type="module">
import {createVoiceService} from "./core/voice.js";
const E=id=>document.getElementById(id),voice=createVoiceService();let pending=null,ready=false;
const demo={ "en-US":["cat","dog","mouse","pig","fish","bird","book","house","water","sun","tree","car"],"es-ES":["gato","perro","ratón","cerdo","pez","pájaro","libro","casa","agua","sol","árbol","coche"],"de-DE":["Katze","Hund","Maus","Schwein","Fisch","Vogel","Buch","Haus","Wasser","Sonne","Baum","Auto"],"da-DK":["kat","hund","mus","gris","fisk","fugl","bog","hus","vand","sol","træ","bil"],"fr-FR":["chat","chien","souris","cochon","poisson","oiseau","livre","maison","eau","soleil","arbre","voiture"],"it-IT":["gatto","cane","topo","maiale","pesce","uccello","libro","casa","acqua","sole","albero","auto"]};
function refresh(){E("pairs").value=demo[E("prompt").value].map((v,i)=>v+"\t"+demo[E("target").value][i]).join("\n")}
E("prompt").onchange=refresh;E("target").onchange=refresh;
E("swap").onclick=()=>{const p=E("prompt").value;E("prompt").value=E("target").value;E("target").value=p;E("pairs").value=E("pairs").value.split("\n").map(line=>{const parts=line.split("\t");return parts.length===2?parts[1]+"\t"+parts[0]:line}).join("\n")};
function back(){pending=null;ready=false;E("play").style.display="none";E("game").removeAttribute("src");voice.cancel()}
E("back").onclick=back;
function deliver(){if(!ready||!pending)return;E("game").contentWindow.postMessage({type:"BT_RACER_START",pairs:pending.pairs,language:pending.language},location.origin);pending=null}
E("start").onclick=()=>{const pairs=E("pairs").value.split(/\r?\n/).filter(x=>x.trim()).map(x=>x.split("\t").map(y=>y.trim()));if(E("prompt").value===E("target").value){E("error").textContent="Choose two different languages.";return}if(pairs.length<5||pairs.length>200||pairs.some(x=>x.length!==2||!x[0]||!x[1])){E("error").textContent="Enter 5–200 valid prompt TAB target pairs.";return}E("error").textContent="";pending={pairs,language:E("target").value};ready=false;const mobile=matchMedia("(pointer:coarse) and (max-width:760px) and (orientation:portrait)").matches;E("game").src=mobile?"./racer-mobile-preview.html":"./racer-game.html";E("play").style.display="block"};
E("game").onload=()=>E("game").contentWindow?.postMessage({type:"BT_RACER_PING"},location.origin);
window.addEventListener("message",event=>{if(event.origin!==location.origin||event.source!==E("game").contentWindow)return;const d=event.data||{};if(d.type==="BT_RACER_READY"){ready=true;deliver()}if(d.type==="BT_RACER_MENU")back();if(d.type==="BT_RACER_SPEAK"&&typeof d.text==="string"&&d.text.length<=250&&Object.keys(demo).includes(d.language))void voice.speak(d.text,d.language);if(d.type==="BT_RACER_CANCEL_SPEECH")voice.cancel();if(d.type==="BT_RACER_START_FAILED"){E("error").textContent="Game could not start.";back()}});
</script></body></html>
