<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Word Racer — Boring Teacher Game Lab</title>
<style>
body{margin:0;background:#10192e;color:#f8f8ff;font:16px "Courier New",monospace}
#racerFrame{display:none;width:100%;height:calc(100dvh - 12px);min-height:600px;border:0;background:#16264e}
#racerFrame.playing{display:block}
#status{max-width:680px;margin:8vh auto;padding:28px;border:5px solid #f3d64e;background:#18375e;text-align:center}
a{color:#f3d64e}button{background:#f3d64e;color:#152945;border:3px solid #152945;padding:12px 18px;font:900 16px "Courier New";cursor:pointer}
</style>
</head>
<body>
<main id="status" role="status" aria-live="polite">Loading shared vocabulary…</main>
<iframe id="racerFrame" title="Word Racer gameplay" src="./racer-game.html"></iframe>
<script type="module">
import { createSharingClient,readStudentSetId } from "./core/sharing.js";
import { createVoiceService } from "./core/voice.js";
const frame=document.getElementById("racerFrame");
const status=document.getElementById("status");
const voice=createVoiceService();
const sharing=createSharingClient({apiBaseUrl:"https://boringteacher-vocabulary-api.mcproductionsdk.workers.dev"});
const dashboard="https://boringteacher.com/dev/word-games/";
const isMobile=window.matchMedia("(pointer:coarse) and (max-width:760px) and (orientation:portrait)").matches;
if(isMobile){frame.src="./racer-mobile-preview.html";frame.style.height="100dvh";frame.style.minHeight="0";}
let ready=false,pending=null;
function showError(message){status.hidden=false;frame.classList.remove("playing");status.replaceChildren();const p=document.createElement("p");p.textContent=message;const a=document.createElement("a");a.href=dashboard;a.textContent="RETURN TO WORD GAMES";status.append(p,a);}
function deliver(){if(!ready||!pending)return;frame.contentWindow.postMessage({type:"BT_RACER_START",pairs:pending.pairs,language:pending.language},location.origin);pending=null;}
window.addEventListener("message",event=>{
 if(event.origin!==location.origin||event.source!==frame.contentWindow)return;
 const data=event.data||{};
 if(data.type==="BT_RACER_READY"){ready=true;deliver();}
 if(data.type==="BT_RACER_SPEAK"&&typeof data.text==="string"&&data.text.length<=250&&["es-ES","de-DE","da-DK","en-US","fr-FR","it-IT"].includes(data.language))void voice.speak(data.text,data.language);
 if(data.type==="BT_RACER_CANCEL_SPEECH")voice.cancel();
 if(data.type==="BT_RACER_MENU")location.assign(dashboard);
 if(data.type==="BT_RACER_START_FAILED")showError("Word Racer could not start this vocabulary set.");
});
frame.addEventListener("load",()=>{ready=false;frame.contentWindow?.postMessage({type:"BT_RACER_PING"},location.origin);});
const id=readStudentSetId(location.href);
if(!id){showError("Select vocabulary in the Boring Teacher universal menu, then launch Word Racer.");}
else{
 try{
  const set=await sharing.loadSet(id);
  if(!Array.isArray(set.pairs)||set.pairs.length<5)throw Error("At least five word pairs are required.");
  pending={pairs:set.pairs,language:set.language};
  status.hidden=true;frame.classList.add("playing");deliver();
  frame.contentWindow?.postMessage({type:"BT_RACER_PING"},location.origin);
 }catch(error){console.error("Word Racer set loading failed",error);showError("Unable to load this shared vocabulary set.");}
}
</script>
</body></html>
