name: Word Racer safety checks
on:
  push:
    branches: [develop, 'feature/**']
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify launcher and gameplay contracts
        run: node --test tests/contracts.test.cjs
